{% extends 'base.html' %}

{% block content %}
{% for cat,msg in get_flashed_messages(True) %}
<div class="flash {{cat}}"> {{msg}}</div>
{% endfor %}
<form action="/registration" method="post" class="form-contact">
    <p><label>Введите логин:</label><input type="text" name="username" value="" required></p>
    <p><label>Введите пароль:</label><input type="text" name="password" value="" required></p>
    <p><label>Повторите пароль:</label><input type="text" name="repeat_password" value="" required></p>
    <p><label>Введите свой возраст:</label><input type="text" name="age" value="" required></p>
    <p><input type="submit" value="Отправить"></p>
</form>
{% endblock %}
