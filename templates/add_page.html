{% extends 'base.html' %}

{% block content %}
{% for cat,msg in get_flashed_messages(True) %}
<div class="flash {{cat}}"> {{msg}}</div>
{% endfor %}
<form action="{{url_for('add_page')}}" method="post" class="form-contact">
    <p><label>Название выпечки:</label><input type="text" name="title" value="" required></p>
    <p><label>Информацию о выпечке:</label>
    <p><textarea name='text' rows="7" cols="40"></textarea></p>
    <p><label>Выберите категорию:</label><input type="text" name="category" value="" required></p>
    <p><input type="submit" value="Добавить"></p>
</form>
{% endblock %}
